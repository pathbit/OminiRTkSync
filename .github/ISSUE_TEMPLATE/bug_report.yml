name: Bug Report
description: Report a defect or synchronization issue in OminiRTKSync
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve OminiRTKSync! Please provide details about the issue so we can reproduce and fix it promptly.
  - type: input
    id: provider
    attributes:
      label: Affected Provider
      description: Which OmniRoute connection failed? (e.g., Antigravity, Claude, Groq, Mistral, Ollama)
      placeholder: e.g., Antigravity / Google OAuth
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened and what was the expected behavior?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: Paste relevant container logs or command output
      render: shell
  - type: input
    id: version
    attributes:
      label: OminiRTKSync Version and Environment
      description: Docker version, container image tag, or local Python version
      placeholder: e.g., ghcr.io/pathbit/ominirtksync:latest on macOS / Linux
    validations:
      required: true

