name: Relato de Bug
description: Reporte um problema ou falha de sincronização no OminiRTKSync
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a aprimorar o OminiRTKSync! Forneça detalhes sobre a falha para podermos reproduzir e corrigir rapidamente.
  - type: input
    id: provider
    attributes:
      label: Provedor Afetado
      description: Qual conexão do OmniRoute apresentou falha? (ex: Antigravity, Claude, Groq, Mistral, Ollama)
      placeholder: ex: Antigravity / Google OAuth
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema
      description: O que aconteceu e qual era o comportamento esperado?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs e Mensagens de Erro
      description: Cole os logs do container ou do comando OminiRTKSync
      render: shell
  - type: input
    id: version
    attributes:
      label: Versão do OminiRTKSync e Ambiente
      description: Versão do Docker, imagem utilizada ou Python local
      placeholder: ex: ghcr.io/pathbit/ominirtksync:latest no macOS Sequoia
    validations:
      required: true
