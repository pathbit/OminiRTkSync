name: Feature Request / Provider Suggestion
description: Suggest a new feature, connection provider, or enhancement for OminiRTKSync
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing improvements for OminiRTKSync!
  - type: textarea
    id: idea
    attributes:
      label: Suggestion Description
      description: Explain in detail your use case or requested enhancement
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: OmniRoute Context
      description: How does OmniRoute manage this connection and how should OminiRTKSync interact with it?

