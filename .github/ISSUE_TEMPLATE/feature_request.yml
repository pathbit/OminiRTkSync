name: Sugestão de Melhoria / Provedor
description: Sugira uma nova funcionalidade, provedor ou melhoria para o OminiRTKSync
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por propor melhorias para o OminiRTKSync!
  - type: textarea
    id: idea
    attributes:
      label: Descrição da Sugestão
      description: Explique detalhadamente o caso de uso ou a melhoria desejada
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto no OmniRoute
      description: Como o OmniRoute gerencia essa conexão e de que forma o OminiRTKSync deve interagir?
