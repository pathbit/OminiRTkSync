name: omniroute-stack

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BASE_URL=http://localhost:20128
      - NODE_ENV=production
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-PathbitDevs2026!}
      - JWT_SECRET=${JWT_SECRET:-omniroute-jwt-secret-key-pathbit}
      - REQUIRE_API_KEY=false
      - REQUIRE_LOGIN=false
    volumes:
      - omniroute_data:/app/data

  ominirtksync:
    image: ghcr.io/pathbit/ominirtksync:latest
    container_name: ominirtksync
    restart: unless-stopped
    ports:
      # Porta interna 9090 (igual no 9RTKSync); publicada em 9092 no host.
      # O bind em 127.0.0.1 mantem o painel e o SQLite fora da internet.
      - "127.0.0.1:9092:9090"
    volumes:
      - omniroute_data:/app/data
      - ${HOME}:/root/host:ro
      - ominirtksync_logs:/app/data/logs
    environment:
      - HOST_HOME=/root/host
      - DB_PATH=/app/data/storage.sqlite
      - OMNIROUTE_URL=${OMNIROUTE_URL:-http://omniroute:20128}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - REFRESH_MARGIN=${REFRESH_MARGIN:-900}
      - ENABLE_WEB_DASHBOARD=${ENABLE_WEB_DASHBOARD:-1}
      - WEB_PORT=${WEB_PORT:-9090}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      # Credencial de emergencia (usuario 'admin' + este valor como senha).
      # Se omitida, e gerada no primeiro boot e registrada no arquivo de log.
      # - DASHBOARD_RECOVERY_HASH=
      - CRON_ENABLED=${CRON_ENABLED:-1}
      # - CRON_INTERVAL=300        # herda SYNC_INTERVAL quando omitido
      - LOG_DIR=${LOG_DIR:-/app/data/logs}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - omniroute
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  omniroute_data:
  ominirtksync_logs:
